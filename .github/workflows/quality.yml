name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show tool versions
        run: |
          python3 --version
          node --version
          npm --version

      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Markdown
        run: npx --yes markdownlint-cli2@0.23.2 '**/*.md' '#.git/**'

      - name: Verify skill discovery
        run: npx --yes skills@1.5.21 add "$GITHUB_WORKSPACE" --list --agent codex

      - name: Check committed whitespace
        run: git show --check --oneline --format=oneline HEAD
