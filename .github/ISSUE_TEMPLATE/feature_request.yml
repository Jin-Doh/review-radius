name: Feature request
description: Propose a bounded improvement to Review Radius.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What review-response failure or workflow gap should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than an implementation only.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Scope boundary
      description: What should this proposal explicitly not change?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link examples, experiments, or prior review feedback when available.
