interface:
  display_name: "Review Radius · 리뷰 대응"
  short_description: "PR 리뷰 루프를 제한하고 QA와 스레드 완료를 분리합니다."
  default_prompt: "Use $review-radius for this PR review session. Freeze the bounded session to the repo, PR, head, and initial thread cursor; require an Architecture Context Packet with the approved boundary, architecture baseline, mechanism or strategy premises, impact delta, defect frontier, verification obligations, and the required independent booleans `patch_required: true|false` and `obligations_blocked: true|false`; apply the evidence governor and record its decision plus the architecture verdict. A blocked required capability, prerequisite, or evidence artifact sets `obligations_blocked: true`, produces `INSUFFICIENT_ARCHITECTURE_EVIDENCE` after stronger strategy signals and before impact review, fuse exhaustion, or local continuation, and cannot produce `CONTINUE_LOCAL` or `AUTOMATION_FUSE_EXHAUSTED`. An available but unfinished obligation remains `obligations_blocked: false` with a separate `INCOMPLETE` status: it is not blocked or complete, cannot establish convergence, and may remain eligible for shrinking local patch work when other governor conditions permit it. Use the two-round automatic fuse as a safety limit, never as evidence of convergence or strategy failure, and never let blocked obligations be represented as fuse exhaustion. Handle every actionable thread in the initial frozen batch, including initial non-blocking feedback; queue only later non-blocking feedback; a same-class blocking comment/reply created after the immutable cutoff pauses the current session for explicit user direction even when it is on a frozen thread. It is not automatically absorbed, queued as non-blocking work, moved to a new session, or assigned to a follow-up. Pause on new defect classes or strategy decisions, while duplicates do not consume rounds and a new head requires new evidence. When an operational finding is confirmed out-of-scope, immediately record and report it as an evidence-only named `PAUSED` item, set `obligations_blocked: true`, and authorize neither edits nor follow-ups; any follow-up assignment remains gated on recorded explicit user direction and independent Review Campaign permission, and reporting or classification alone never authorizes it. Acceptance examples and illustrative scenarios do not create this immediate-reporting obligation. Keep QA verdict, delivery state, review-thread completion, architecture verdict, `patch_required`, `obligations_blocked`, and per-obligation completeness/status independent; report each separately and complete each separately."
